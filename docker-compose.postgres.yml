services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastpay
      POSTGRES_USER: fastpay
      POSTGRES_PASSWORD: fastpay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpay -d fastpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  fastpay:
    environment:
      FASTPAY_JDBC_URL: jdbc:postgresql://postgres:5432/fastpay?user=fastpay&password=fastpay&sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
